<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RWF Prep Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Layout: one column, summary chart first, then a guild switcher over grouped roster tables.
   Look: the Midnight theme from the OnlyFlex app: near-black ground, charcoal cards with a
   hairline edge and 16px corners, sky-blue accent, Manrope with extra-bold titles, gradient
   bars. Logbook, the app's paper theme, is the light version. */
:root {
  --bg: #0B0B0D; --surface: #151515; --surface-2: #202124; --line: #28292D; --line-strong: #34363B;
  --fg: #EEF4FA; --fg-2: #9EA7B3; --muted: #77808C;
  --accent: #38C1FC; --accent-ink: #04121F; --accent-deep: #0F579C; --accent-muted: #0F3050;
  --g0: #38C1FC; --g1: #9B7BFF; --g2: #4CC038; --g3: #FF7A50;
  --good: #4CC038; --bad: #E5533D; --gold: #F5B70A; --unknown: #77808C;
  --role-tank: #38C1FC; --role-healer: #4CC038; --role-dps: #E5533D; --role-ranged: #F5B70A;
  --radius: 16px; --radius-sm: 10px;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --mono: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #EFECE3; --surface: #F8F6F0; --surface-2: #E4E0D4; --line: #D3CEC0; --line-strong: #BFB9A9;
    --fg: #171614; --fg-2: #5E5A50; --muted: #8C8678;
    --accent: #2546F0; --accent-ink: #FFFFFF; --accent-deep: #142684; --accent-muted: #DDE3FD;
    --g0: #2546F0; --g1: #7B4FD6; --g2: #2E8B2A; --g3: #C8372D;
    --good: #2E8B2A; --bad: #C8372D; --gold: #B7860B; --unknown: #8C8678;
    --role-tank: #2546F0; --role-healer: #2E8B2A; --role-dps: #C8372D; --role-ranged: #B7860B;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #EFECE3; --surface: #F8F6F0; --surface-2: #E4E0D4; --line: #D3CEC0; --line-strong: #BFB9A9;
  --fg: #171614; --fg-2: #5E5A50; --muted: #8C8678;
  --accent: #2546F0; --accent-ink: #FFFFFF; --accent-deep: #142684; --accent-muted: #DDE3FD;
  --g0: #2546F0; --g1: #7B4FD6; --g2: #2E8B2A; --g3: #C8372D;
  --good: #2E8B2A; --bad: #C8372D; --gold: #B7860B; --unknown: #8C8678;
  --role-tank: #2546F0; --role-healer: #2E8B2A; --role-dps: #C8372D; --role-ranged: #B7860B;
  color-scheme: light;
}
/* Guild brand colours as series tokens, written by build.py from config.json. */
:root { --g0: #E83344; --g0-deep: #a72531; --g0-ring: rgba(232, 51, 68, 0.35); --g1: #3BB0D4; --g1-deep: #2a7f99; --g1-ring: rgba(59, 176, 212, 0.35); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --g0: #B07A1A; --g0-deep: #7f5813; --g0-ring: rgba(176, 122, 26, 0.35); --g1: #1C8AA8; --g1-deep: #146379; --g1-ring: rgba(28, 138, 168, 0.35); } }
:root[data-theme="light"] { --g0: #B07A1A; --g0-deep: #7f5813; --g0-ring: rgba(176, 122, 26, 0.35); --g1: #1C8AA8; --g1-deep: #146379; --g1-ring: rgba(28, 138, 168, 0.35); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line-strong); }
a:hover { border-bottom-color: var(--accent); }
h1, h2, h3 { font-family: var(--body); font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.2rem; margin-bottom: 10px; }
h3 { font-size: 1rem; font-weight: 700; }
.wrap { max-width: 1180px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-block: 26px 10px; }
header.top .sub { color: var(--fg-2); font-size: 0.92rem; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--line-strong); color: var(--fg-2); white-space: nowrap; }
.chip.accent { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.chip.good { color: var(--good); border-color: var(--good); }
.chip.bad { color: var(--bad); border-color: var(--bad); }
.chip.unknown { color: var(--unknown); border-style: dashed; }
.chip.inactive { color: var(--muted); border-style: dashed; }
.chip.new { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.chip.over { color: var(--accent); border-color: var(--accent); }
.chip.role-tank { color: var(--role-tank); border-color: var(--role-tank); background: rgba(56, 193, 252, 0.14); }
.chip.role-healer { color: var(--role-healer); border-color: var(--role-healer); background: rgba(76, 192, 56, 0.14); }
.chip.role-dps, .chip.role-melee { color: var(--role-dps); border-color: var(--role-dps); background: rgba(229, 83, 61, 0.14); }
.chip.role-ranged { color: var(--role-ranged); border-color: var(--role-ranged); background: rgba(245, 183, 10, 0.14); }
td.prog { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.84rem; color: var(--fg-2); }
td.prog.full { color: var(--fg); font-weight: 800; }
section { margin-top: 30px; }
.lede { color: var(--fg-2); max-width: 70ch; margin: 0 0 14px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 700; }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 14px 0 18px; }
.kpi { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.kpi .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; color: var(--muted); }
.kpi .value { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 800; font-size: 2rem; line-height: 1.15; margin-top: 2px; }
.kpi .value small { font-size: 0.85rem; color: var(--fg-2); font-weight: 600; }
.kpi .note { font-size: 0.8rem; color: var(--fg-2); }

/* Summary chart */
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px 12px; }
.chart .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; font-size: 0.85rem; color: var(--fg-2); margin-bottom: 12px; }
.legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 6px; }
.crow { display: grid; grid-template-columns: 190px 1fr 56px; align-items: center; gap: 0 10px; padding: 3px 0; border-top: 1px solid var(--line); }
.cgroup:first-of-type > .crow { border-top: 0; }
summary.crow { list-style: none; cursor: pointer; }
summary.crow::-webkit-details-marker { display: none; }
summary.crow:hover { background: var(--surface-2); }
summary.crow .cls span::after { content: " +"; color: var(--muted); font-family: var(--mono); }
.cgroup[open] > summary.crow .cls span::after { content: " -"; }
.crow.spec { border-top: 1px dashed var(--line); padding-left: 26px; }
.crow.spec .cls { font-size: 0.82rem; color: var(--fg-2); }
.crow.spec .bar { height: 7px; opacity: 0.85; }
.crow.spec .tot { font-size: 0.82rem; }
.crow .cls { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; min-width: 0; }
.crow .cls span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.csw { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line-strong); flex: none; }
img.csw { object-fit: cover; }
.bars { display: grid; gap: 3px; }
.bar { position: relative; height: 10px; background: var(--surface-2); border-radius: 999px; cursor: default; }
.bar i { display: block; height: 100%; border-radius: 999px; transition: width 0.3s ease; }
.bar:hover i, .bar:focus i { filter: brightness(1.2); }
.crow .tot { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; font-size: 0.9rem; color: var(--fg-2); }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface-2); color: var(--fg); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 0.82rem; box-shadow: 0 10px 30px rgba(0,0,0,0.45); max-width: 260px; }
.tip b { display: block; margin-bottom: 3px; }
.tip .row { display: flex; justify-content: space-between; gap: 12px; }
.chart-foot { color: var(--muted); font-size: 0.8rem; margin-top: 8px; }

/* Guild switcher and filters */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.tabs button { font: inherit; font-weight: 800; letter-spacing: 0.02em; padding: 9px 18px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg-2); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--tab-bg, var(--accent)); color: var(--tab-fg, var(--accent-ink)); border-color: var(--series); box-shadow: 0 0 0 2px var(--series-ring, transparent); }
.tabs button[aria-selected="true"] .num { color: var(--tab-num, var(--series)); opacity: 1; }
.tabs button:focus-visible, .filters :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs button:hover { border-color: var(--series); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px 20px; }
.panel[hidden] { display: none; }
.meta { color: var(--fg-2); font-size: 0.88rem; display: flex; flex-wrap: wrap; gap: 4px 18px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 14px 0 10px; }
.filters input, .filters select { font: inherit; font-size: 0.9rem; padding: 7px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-2); color: var(--fg); }
.filters input[type="search"] { min-width: 200px; }
.filters label { font-size: 0.85rem; color: var(--fg-2); display: inline-flex; align-items: center; gap: 6px; }
.filters .count { margin-left: auto; color: var(--muted); font-size: 0.85rem; }

/* Mains */
.group > summary { list-style: none; cursor: pointer; padding: 10px 4px 6px; font-weight: 600; color: var(--fg-2); border-top: 2px solid var(--line-strong); margin-top: 14px; }
.group > summary::-webkit-details-marker { display: none; }
.group > summary::before { content: "+"; display: inline-block; width: 16px; color: var(--muted); font-family: var(--mono); }
.group[open] > summary::before { content: "-"; }
.group > summary small { font-weight: 400; color: var(--muted); margin-left: 8px; }
.grouphead { padding: 10px 4px 6px; font-weight: 600; color: var(--fg-2); }
.grouphead small { font-weight: 400; color: var(--muted); margin-left: 8px; }
.main { border-top: 1px solid var(--line); }
.main summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 230px 120px 1fr; gap: 12px; align-items: center; padding: 10px 8px; border-radius: var(--radius-sm); }
.main summary::-webkit-details-marker { display: none; }
.main summary:hover { background: var(--surface-2); }
.main summary .mn { font-weight: 700; }
.main summary .mn::before { content: "+"; display: inline-block; width: 16px; color: var(--muted); font-family: var(--mono); }
.main[open] summary .mn::before { content: "-"; }
.main summary .prep { font-family: var(--mono); font-size: 0.9rem; color: var(--fg-2); white-space: nowrap; }
.main summary .mn .chip { margin-left: 10px; font-weight: 500; vertical-align: 1px; }
.main summary .prep b { color: var(--fg); }
.miniclasses { display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-start; }
.miniclasses img, .miniclasses i { width: 18px; height: 18px; border-radius: 4px; display: inline-block; border: 1px solid var(--line-strong); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 640px; }
th, td { text-align: left; padding: 5px 8px; border-top: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; border-top: 0; }
td.r, th.r { text-align: right; }
td .csw { display: inline-block; vertical-align: -3px; margin-right: 6px; }
td.name a { border-bottom-color: transparent; }
td.name a:hover { border-bottom-color: var(--accent); }
td.name small { color: var(--muted); margin-left: 4px; }
td.name a.rio { margin-left: 8px; border-bottom: 0; display: inline-block; vertical-align: -4px; line-height: 0; opacity: 0.75; }
td.name a.rio img { width: 16px; height: 16px; border-radius: 50%; display: block; }
td.name a.rio:hover { opacity: 1; }
tr.not-prepared td, tr.over td { color: var(--fg-2); }
tr.unknown td { color: var(--muted); }
td.fresh { color: var(--fg-2); }
td.stale { color: var(--bad); }
.hidden-row { display: none; }

/* Unmatched */
.unmatched .lede code { font-family: var(--mono); font-size: 0.85em; background: var(--surface-2); padding: 1px 5px; border-radius: 3px; }
td .sugg { color: var(--fg-2); }
td .sugg b { color: var(--accent); font-weight: 500; }

footer { margin-top: 40px; color: var(--muted); font-size: 0.82rem; border-top: 1px solid var(--line); padding-top: 12px; }
@media (max-width: 640px) {
  .crow { grid-template-columns: 120px 1fr 44px; }
  .crow.spec { padding-left: 12px; }
  .main summary { grid-template-columns: 1fr auto; }
  .miniclasses { display: none; }
  .tabs button[aria-selected="true"] { box-shadow: inset 0 3px 0 var(--series); }
  .filters .count { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>


<div class="wrap">
<header class="top">
  <h1>RWF Prep Tracker</h1>
  <span class="chip accent" id="tier-label"></span>
  <span class="sub" id="tier-rule"></span>
  <span class="sub" id="generated"></span>
</header>

<section id="summary">
  <h2>Prepared characters by class</h2>
  <div class="chart" id="chart"></div>
</section>

<section id="guilds">
  <h2>Rosters</h2>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="panels"></div>
</section>

<footer id="foot"></footer>
</div>

","name":"Tokyogrift","realm":"Illidan","class":"Hunter","spec":"Marksmanship","role":"Ranged","rank":4,"level":90,"ilvl":305,"fresh":"2026-11-03T21:40:34Z","seen":"2026-11-09T09:21:26Z","status":"yes","armory":"https://worldofwarcraft.blizzard.com/en-us/character/us/illidan/tokyogrift","profile":"https://raider.io/characters/us/illidan/Tokyogrift","progress":{"season-1":"","season-2":"5/10 M"},"suggestions":[]},{"key":"kkrona@illidan","name":"Kkrona","realm":"Illidan","class":"Priest","spec":"Shadow","role":"Ranged","rank":4,"level":90,"ilvl":299,"fresh":"2026-11-08T03:45:48Z","seen":"2026-11-09T09:21:27Z","status":"yes","armory":"https://worldofwarcraft.blizzard.com/en-us/character/us/illidan/kkrona","profile":"https://raider.io/characters/us/illidan/Kkrona","progress":{"season-1":"","season-2":""},"suggestions":[]}],"by_class":{"Death Knight":{"total":55,"prepared":43,"specs":{"Frost":21,"Blood":17,"Unholy":5}},"Demon Hunter":{"total":77,"prepared":48,"specs":{"Havoc":26,"Vengeance":14,"Devourer":8}},"Druid":{"total":76,"prepared":44,"specs":{"Guardian":17,"Balance":15,"Restoration":7,"Feral":5}},"Evoker":{"total":77,"prepared":51,"specs":{"Devastation":41,"Preservation":9,"Augmentation":1}},"Hunter":{"total":61,"prepared":42,"specs":{"Beast Mastery":24,"Marksmanship":15,"Survival":3}},"Mage":{"total":62,"prepared":40,"specs":{"Arcane":34,"Fire":3,"Frost":3}},"Monk":{"total":52,"prepared":31,"specs":{"Mistweaver":14,"Windwalker":13,"Brewmaster":4}},"Paladin":{"total":49,"prepared":31,"specs":{"Protection":12,"Holy":11,"Retribution":8}},"Priest":{"total":65,"prepared":44,"specs":{"Shadow":22,"Holy":17,"Discipline":5}},"Rogue":{"total":45,"prepared":29,"specs":{"Assassination":16,"Subtlety":12,"Outlaw":1}},"Shaman":{"total":53,"prepared":42,"specs":{"Elemental":19,"Restoration":14,"Enhancement":9}},"Warlock":{"total":49,"prepared":36,"specs":{"Demonology":30,"Affliction":3,"Destruction":3}},"Warrior":{"total":53,"prepared":42,"specs":{"Arms":30,"Protection":10,"Fury":2}}}}]}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("rwf-data").textContent);
  // Series tokens --g0, --g1 ... carry each guild's brand colour; build.py writes them
  // into the stylesheet above, so nothing here depends on injecting styles at run time.
  var SERIES = DATA.guilds.map(function (g, i) { return "var(--g" + i + ")"; });
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

  function relTime(iso) {
    if (!iso) return "never";
    var t = Date.parse(iso); if (isNaN(t)) return iso;
    var d = (Date.now() - t) / 1000;
    if (d < 3600) return Math.max(1, Math.round(d / 60)) + " min ago";
    if (d < 86400) return Math.round(d / 3600) + " h ago";
    if (d < 86400 * 30) return Math.round(d / 86400) + " d ago";
    if (d < 86400 * 365) return Math.round(d / (86400 * 30)) + " mo ago";
    return Math.round(d / (86400 * 365)) + " y ago";
  }
  function staleClass(iso) {
    if (!iso) return "stale";
    var d = (Date.now() - Date.parse(iso)) / 86400000;
    return d > 14 ? "stale" : "fresh";
  }
  function classSwatch(cls) {
    var src = DATA.class_icons[cls];
    if (src) return '<img class="csw" src="' + src + '" alt="" title="' + esc(cls) + '">';
    var c = DATA.class_colors[cls] || "transparent";
    return '<i class="csw" style="background:' + c + '" aria-hidden="true"></i>';
  }
  function progCells(c) {
    return DATA.raids.map(function (r) {
      var s = (c.progress && c.progress[r.slug]) || "";
      var full = /^(\d+)\/\1 /.test(s);
      return '<td class="prog' + (full ? " full" : "") + '">' + esc(s) + '</td>';
    }).join("");
  }

  // Header
  document.getElementById("tier-label").textContent = DATA.tier.label;
  document.getElementById("tier-rule").textContent = "Prepared means " + DATA.tier.rule_text + ".";
  document.getElementById("generated").textContent = "Built " + relTime(DATA.generated_at) + " from " + (DATA.source === "blizzard" ? "the Blizzard API" : "raider.io") + ".";

  // Summary chart: one row per class, one bar per guild. Each class row opens to show
  // its specs as smaller rows on the same scale.
  (function renderChart() {
    var guilds = DATA.guilds;
    var rows = DATA.classes.map(function (c) {
      var values = guilds.map(function (g) { return g.by_class[c] ? g.by_class[c].prepared : 0; });
      var specNames = {};
      guilds.forEach(function (g) { if (g.by_class[c]) Object.keys(g.by_class[c].specs).forEach(function (s) { specNames[s] = true; }); });
      var specs = Object.keys(specNames).map(function (s) {
        var v = guilds.map(function (g) { return g.by_class[c] ? (g.by_class[c].specs[s] || 0) : 0; });
        return { name: s, values: v, total: v.reduce(function (a, b) { return a + b; }, 0) };
      });
      specs.sort(function (a, b) { return b.total - a.total || a.name.localeCompare(b.name); });
      return { cls: c, values: values, total: values.reduce(function (a, b) { return a + b; }, 0), specs: specs };
    }).filter(function (r) { return r.total > 0; });
    rows.sort(function (a, b) { return b.total - a.total || a.cls.localeCompare(b.cls); });
    var max = 1;
    rows.forEach(function (r) { r.values.forEach(function (v) { if (v > max) max = v; }); });
    function bars(label, values, specTips) {
      return '<div class="bars">' + guilds.map(function (g, i) {
        var n = i % SERIES.length;
        return '<div class="bar" tabindex="0" data-guild="' + esc(g.name) + '" data-class="' + esc(label) + '" data-n="' + values[i] + '" data-specs=\'' + esc(JSON.stringify(specTips ? specTips[i] : {})) + '\'><i style="width:' + (100 * values[i] / max) + '%;background:var(--g' + n + ');background:linear-gradient(90deg, var(--g' + n + '-deep), var(--g' + n + '))"></i></div>';
      }).join("") + '</div>';
    }
    var html = '<div class="legend">' + guilds.map(function (g, i) {
      return '<span><i class="sw" style="background:' + SERIES[i % SERIES.length] + '"></i>' + esc(g.name) + ' <span class="num">' + g.counts.raider_prepared + '</span></span>';
    }).join("") + '<span style="margin-left:auto">Click a class for its specs</span></div>';
    rows.forEach(function (r) {
      var specTips = guilds.map(function (g) { return g.by_class[r.cls] ? g.by_class[r.cls].specs : {}; });
      html += '<details class="cgroup"><summary class="crow"><div class="cls">' + classSwatch(r.cls) + '<span>' + esc(r.cls) + '</span></div>' + bars(r.cls, r.values, specTips) + '<div class="tot">' + r.total + '</div></summary>';
      r.specs.forEach(function (s) {
        html += '<div class="crow spec"><div class="cls"><span>' + esc(s.name) + '</span></div>' + bars(s.name + " " + r.cls, s.values) + '<div class="tot">' + s.total + '</div></div>';
      });
      html += '</details>';
    });
    document.getElementById("chart").innerHTML = html;
  })();

  // Tooltip for bars
  var tip = document.getElementById("tip");
  function showTip(el, x, y) {
    var specs = JSON.parse(el.getAttribute("data-specs") || "{}");
    var rows = Object.keys(specs).map(function (s) { return '<div class="row"><span>' + esc(s) + '</span><span class="num">' + specs[s] + '</span></div>'; }).join("");
    tip.innerHTML = "<b>" + esc(el.getAttribute("data-guild")) + ": " + esc(el.getAttribute("data-class")) + ' <span class="num">' + el.getAttribute("data-n") + "</span></b>" + rows;
    tip.hidden = false;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(x + 14, window.innerWidth - w - 8) + "px";
    tip.style.top = (y + 16 + h > window.innerHeight ? y - h - 8 : y + 16) + "px";
  }
  document.getElementById("chart").addEventListener("mousemove", function (e) {
    var el = e.target.closest(".bar"); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true;
  });
  document.getElementById("chart").addEventListener("mouseleave", function () { tip.hidden = true; });
  document.getElementById("chart").addEventListener("focusin", function (e) {
    var el = e.target.closest(".bar"); if (el) { var r = el.getBoundingClientRect(); showTip(el, r.left, r.top); }
  });
  document.getElementById("chart").addEventListener("focusout", function () { tip.hidden = true; });

  // Guild panels
  function charRow(c, extra) {
    var cls = c.status === "yes" ? "" : (c.status === "no" ? "not-prepared" : c.status);
    var fresh = c.fresh;
    return '<tr class="' + cls + '" data-status="' + c.status + '" data-class="' + esc(c.class) + '" data-role="' + esc(c.role || "") + '" data-search="' + esc((c.name + " " + (c.spec || "") + " " + c.class + " " + c.realm).toLowerCase()) + '">' +
      '<td class="name">' + classSwatch(c.class) + '<a href="' + esc(c.armory) + '" target="_blank" rel="noopener">' + esc(c.name) + '</a><small>' + esc(c.realm) + '</small>' +
      (c.profile && DATA.site_icons.raiderio ? '<a class="rio" href="' + esc(c.profile) + '" target="_blank" rel="noopener" title="Open on raider.io"><img src="' + DATA.site_icons.raiderio + '" alt="raider.io"></a>' : "") + '</td>' +
      '<td>' + esc(c.class) + '</td><td>' + esc(c.spec || "") + '</td><td>' + esc(c.role || "") + '</td>' +
      '<td class="r num">' + (c.level == null ? "?" : c.level) + '</td>' +
      '<td class="r num">' + (c.ilvl ? c.ilvl : "?") + '</td>' + progCells(c) +
      '<td class="' + staleClass(fresh) + '" title="' + esc(fresh || "no gear data") + '">' + relTime(fresh) + '</td>' + (extra || "") + '</tr>';
  }
  var TH = '<tr><th>Character</th><th>Class</th><th>Spec</th><th>Role</th><th class="r">Level</th><th class="r">Item level</th>' +
    DATA.raids.map(function (r) { return '<th title="' + esc(r.instances.join(", ")) + '">' + esc(r.label) + '</th>'; }).join("") +
    '<th>Gear seen</th>';

  function renderGuild(g, i) {
    var c = g.counts;
    var html = '<div class="meta"><span>' + esc(g.name) + ', ' + esc(g.realm) + ' (' + esc(g.region) + ')</span>' +
      '<span>Roster crawled ' + relTime(g.roster_crawled_at) + '</span><span>Data refreshed ' + relTime(g.updated_at) + '</span>' +
      (g.profile_url ? '<a href="' + esc(g.profile_url) + '" target="_blank" rel="noopener">guild page</a>' : "") + '</div>';
    html += '<div class="kpis">' +
      (c.raider_split
        ? '<div class="kpi"><div class="label">Raiders prepared</div><div class="value">' + c.raider_prepared + '</div><div class="note">characters of the ' + c.raiders + ' main raiders</div></div>'
        : '<div class="kpi"><div class="label">Prepared</div><div class="value">' + c.prepared + '</div><div class="note">' + c.unknown + ' unknown</div></div>') +
      '<div class="kpi"><div class="label">Unmatched</div><div class="value">' + c.unmatched + '</div><div class="note">' + c.unmatched_prepared + ' of them prepared, need a manual match</div></div>' +
      '</div>';
    var classOpts = DATA.classes.map(function (k) { return '<option>' + esc(k) + '</option>'; }).join("");
    html += '<div class="filters">' +
      '<input type="search" id="q-' + i + '" placeholder="Search name, spec, class" aria-label="Search characters">' +
      '<select id="cl-' + i + '" aria-label="Class"><option value="">Any class</option>' + classOpts + '</select>' +
      '<select id="ro-' + i + '" aria-label="Role"><option value="">Any role</option><option>Tank</option><option>Healer</option><option>Melee</option><option>Ranged</option></select>' +
      '<label><input type="checkbox" id="open-' + i + '"> Expand all</label>' +
      '<span class="count" id="count-' + i + '"></span></div>';
    function mainBlock(m) {
      var mini = '<span class="miniclasses">' + m.icons.map(function (cls) {
        var src = DATA.class_icons[cls];
        return src ? '<img src="' + src + '" alt="' + esc(cls) + '" title="' + esc(cls) + '">' : '<i style="background:' + (DATA.class_colors[cls] || "transparent") + '" title="' + esc(cls) + '"></i>';
      }).join("") + '</span>';
      // Other members are not raiders, so their rows carry a plain character count instead of a prepared count.
      var count = m.raider ? '<b>' + m.prepared + '</b> prepared' : '<b>' + m.chars.length + '</b> character' + (m.chars.length === 1 ? "" : "s");
      var role = m.raider ? '<span class="chip role-' + esc(m.role.toLowerCase()) + '">' + esc(m.role) + '</span>' : (m.inactive ? '<span class="chip inactive">Inactive</span>' : "");
      if (m.new) role += '<span class="chip new" title="Just added to the roster">New</span>';
      return '<details class="main"><summary><span class="mn">' + esc(m.name) + role + '</span><span class="prep">' + count + '</span>' + mini + '</summary>' +
        '<div class="tablewrap"><table><thead>' + TH + '</tr></thead><tbody>' + m.chars.map(function (ch) { return charRow(ch); }).join("") + '</tbody></table></div></details>';
    }
    var raiders = g.mains.filter(function (m) { return m.raider; }), others = g.mains.filter(function (m) { return !m.raider; });
    html += '<div class="mains" id="mains-' + i + '">';
    if (c.raider_split) html += '<div class="grouphead">Main raiders</div>';
    html += raiders.map(mainBlock).join("");
    if (others.length) {
      html += '<details class="group" id="others-' + i + '"><summary>Other members<small>' + others.length + '</small></summary>' + others.map(mainBlock).join("") + '</details>';
    }
    html += '</div>';
    html += '<section class="unmatched"><h3>Unmatched characters (' + g.unmatched.length + ')</h3>' +
      '<p class="lede">Not yet tied to a main. Suggestions are name-prefix hints only.</p>' +
      '<div class="tablewrap"><table><thead>' + TH + '<th>Key</th><th>Suggested main</th></tr></thead><tbody>' +
      g.unmatched.map(function (ch) {
        var s = ch.suggestions && ch.suggestions.length ? '<span class="sugg"><b>' + esc(ch.suggestions[0]) + '</b>' + (ch.suggestions.length > 1 ? ' or ' + esc(ch.suggestions.slice(1).join(", ")) : "") + '</span>' : "";
        return charRow(ch, '<td class="num">' + esc(ch.key) + '</td><td>' + s + '</td>');
      }).join("") + '</tbody></table></div></section>';
    return html;
  }

  var tabs = document.getElementById("tabs"), panels = document.getElementById("panels");
  DATA.guilds.forEach(function (g, i) {
    var b = document.createElement("button");
    b.type = "button"; b.role = "tab"; b.id = "tab-" + i; b.setAttribute("aria-controls", "panel-" + i);
    b.style.setProperty("--series", SERIES[i % SERIES.length]);
    b.style.setProperty("--series-ring", "var(--g" + (i % SERIES.length) + "-ring)");
    b.style.setProperty("--tab-bg", g.colors.bg);
    b.style.setProperty("--tab-fg", g.colors.fg);
    b.style.setProperty("--tab-num", g.colors.num);
    b.innerHTML = esc(g.name) + ' <span class="num" style="font-weight:400;opacity:0.8">' + g.counts.raider_prepared + "</span>";
    b.addEventListener("click", function () { select(i, true); });
    tabs.appendChild(b);
    var p = document.createElement("div");
    p.className = "panel"; p.id = "panel-" + i; p.setAttribute("role", "tabpanel"); p.hidden = true;
    p.innerHTML = renderGuild(g, i);
    panels.appendChild(p);
    wireFilters(i);
  });

  function select(i, fromClick) {
    DATA.guilds.forEach(function (g, j) {
      document.getElementById("tab-" + j).setAttribute("aria-selected", i === j ? "true" : "false");
      document.getElementById("panel-" + j).hidden = i !== j;
    });
    if (fromClick) { try { localStorage.setItem("rwf-tab", String(i)); } catch (e) {} }
  }
  function wireFilters(i) {
    var q = document.getElementById("q-" + i), cl = document.getElementById("cl-" + i), ro = document.getElementById("ro-" + i), open = document.getElementById("open-" + i);
    var rows = document.querySelectorAll("#panel-" + i + " tr[data-status]");
    var mains = document.querySelectorAll("#mains-" + i + " details.main");
    var group = document.getElementById("others-" + i);
    var wasFiltering = false;
    function apply() {
      var text = q.value.trim().toLowerCase(), c = cl.value, role = ro.value, shown = 0;
      rows.forEach(function (r) {
        var ok = (!text || r.getAttribute("data-search").indexOf(text) >= 0) && (!c || r.getAttribute("data-class") === c) && (!role || r.getAttribute("data-role") === role);
        r.classList.toggle("hidden-row", !ok); if (ok) shown++;
      });
      var filtering = !!(text || c || role);
      // Starting a filter expands everything and ticks the box, so the box always
      // reflects the real state and unticking it collapses the list again.
      if (filtering !== wasFiltering) { open.checked = filtering; wasFiltering = filtering; }
      mains.forEach(function (d) {
        var any = d.querySelectorAll("tbody tr:not(.hidden-row)").length > 0;
        d.style.display = any ? "" : "none";
        d.open = open.checked;
      });
      if (group) {
        var groupAny = group.querySelectorAll("tbody tr:not(.hidden-row)").length > 0;
        group.style.display = groupAny || !filtering ? "" : "none";
        group.open = open.checked && (groupAny || !filtering);
      }
      document.getElementById("count-" + i).textContent = shown + " of " + rows.length + " characters shown";
    }
    q.addEventListener("input", apply); cl.addEventListener("change", apply); ro.addEventListener("change", apply);
    open.addEventListener("change", apply);
    apply();
  }
  var initial = 0;
  var hashKey = (location.hash || "").slice(1);
  DATA.guilds.forEach(function (g, i) { if (g.key === hashKey || g.name.toLowerCase() === hashKey.toLowerCase()) initial = i; });
  if (!hashKey) { try { var saved = parseInt(localStorage.getItem("rwf-tab"), 10); if (!isNaN(saved) && saved < DATA.guilds.length) initial = saved; } catch (e) {} }
  select(initial, false);

  document.getElementById("foot").innerHTML = "Rosters and gear from " + (DATA.source === "blizzard" ? "the Blizzard Battle.net API" : "raider.io, which republishes Blizzard Armory data") +
    (DATA.source === "blizzard" ? "" : "; character level from rxptracker.com where raider.io has none") + ". Main-to-alt matching is maintained by hand. The Armory only updates when a character logs out, so a fresh character can look unprepared until its player logs off it.";
})();
</script>
